org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Force IPv4 to prevent connection abortion by ISP / Windows network stack
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.keepAlive=false
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
